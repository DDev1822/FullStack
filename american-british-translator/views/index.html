<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>American / British English Translator</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <main class="container">
    <h1>American / British English Translator</h1>
    <p>Translate spelling, vocabulary, titles and time notation between American and British English.</p>

    <form id="translate-form">
      <label for="text-input">Text</label>
      <textarea id="text-input" name="text" rows="6" placeholder="Mangoes are my favorite fruit."></textarea>

      <label for="locale-select">Direction</label>
      <select id="locale-select" name="locale">
        <option value="american-to-british">American to British</option>
        <option value="british-to-american">British to American</option>
      </select>

      <button id="translate-btn" type="submit">Translate</button>
    </form>

    <section class="result" aria-live="polite">
      <h2>Translation</h2>
      <p id="translated-sentence">Enter text and choose a direction.</p>
      <p id="error-msg"></p>
    </section>
  </main>

  <script src="/public/client.js"></script>
</body>
</html>
