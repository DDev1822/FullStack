<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anonymous Message Board</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <main>
    <header>
      <h1>Anonymous Message Board</h1>
      <p>A freeCodeCamp full-stack JavaScript project.</p>
    </header>

    <section class="card">
      <h2>Open a board</h2>
      <p>Boards are addressed at <code>/b/&lt;board&gt;/</code>.</p>
      <p><a href="/b/general/">Open the general board</a></p>
    </section>

    <section class="card">
      <h2>API</h2>
      <p><code>/api/threads/:board</code> supports POST, GET, PUT and DELETE.</p>
      <p><code>/api/replies/:board</code> supports POST, GET, PUT and DELETE.</p>
    </section>
  </main>
</body>
</html>
