name: Stock Price Checker Test

on:
  push:
    branches: [main]
    paths:
      - 'stock-price-checker/**'
      - '.github/workflows/stock-price-checker-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-price-checker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Probe stock proxy
        run: |
          : > proxy-probes.txt
          for symbol in GOOG IBM; do
            echo "--- ${symbol} ---" >> proxy-probes.txt
            curl --silent --show-error --location \
              --write-out '\nHTTP_STATUS:%{http_code}\n' \
              "https://stock-price-checker-proxy.freecodecamp.rocks/v1/stock/${symbol}/quote" \
              >> proxy-probes.txt || true
          done

      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Validate 5/5 functional tests
        run: node ci-check.js

      - name: Show diagnostics on failure
        if: failure()
        run: |
          echo '--- Proxy probes ---'
          cat proxy-probes.txt || true
          echo '--- CI result ---'
          cat ci-result.json || true
          echo '--- Server log ---'
          cat server.log || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-price-checker-diagnostics
          path: |
            stock-price-checker/proxy-probes.txt
            stock-price-checker/ci-result.json
            stock-price-checker/server.log
          if-no-files-found: warn

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi
