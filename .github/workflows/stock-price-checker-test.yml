name: Stock Price Checker Test

on:
  push:
    branches: [main]
    paths:
      - 'stock-price-checker/**'
      - '.github/workflows/stock-price-checker-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-price-checker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Validate 5/5 functional tests
        run: node ci-check.js

      - name: Show server log on failure
        if: failure()
        run: cat server.log || true

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi
